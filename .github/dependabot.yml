version: 2

updates:
  # Workflow actions are SHA-pinned, so Dependabot is the only thing that keeps
  # those pins current. One grouped pull request per week.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Root npm workspace: package.json and package-lock.json cover apps/* and
  # packages/*. Monthly, with minor and patch batched so version updates stay
  # quiet alongside the centrally enabled security updates.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Root Dockerfile base images (node:22-alpine).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
